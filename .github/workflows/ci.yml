name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --filter '@microx-technologies/microwireflow' build

      - name: Build demo
        run: bun --filter '@microx-technologies/microwireflow-demo' build

      - name: Check
        run: bun run check

      - name: Test
        run: bun --filter '@microx-technologies/microwireflow' test
