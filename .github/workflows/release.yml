name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Verify version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg_version="$(bun -p "require('./packages/microwireflow/package.json').version")"
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::Tag '$tag' does not match package.json version '$pkg_version'."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --filter 'microwireflow' build && bun --filter '@microx-technologies/microwireflow-demo' build

      - name: Push compiled release branch
        run: |
          VERSION="${{ github.ref_name }}"
          TMP_COMPILED=$(mktemp -d)
          cp -r packages/microwireflow/dist "$TMP_COMPILED/dist"
          cp packages/microwireflow/package.json "$TMP_COMPILED/package.json"
          cp packages/microwireflow/README.md "$TMP_COMPILED/README.md"
          cp packages/microwireflow/LICENSE "$TMP_COMPILED/LICENSE"

          cd "$TMP_COMPILED"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${VERSION}"
          git add -A
          git commit -m "release: ${VERSION} compiled distribution"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin "${VERSION}"

          if [[ "${VERSION}" != *-* ]]; then
            git checkout -B latest
            git push -f origin latest
          fi

      - name: Pack tarball
        run: cd packages/microwireflow && bun pm pack && mv *.tgz ../../

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./*.tgz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy-demo:
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
